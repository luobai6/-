<style>
  .board { color:#292b25; font-family:"Microsoft YaHei","Noto Sans SC",sans-serif; }
  .board h1 { margin:0 0 8px; font-size:26px; }
  .lead { margin:0 0 18px; color:#65675e; line-height:1.65; }
  .rule { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
  .rule-card { padding:12px 14px; border-radius:12px; background:#f4f0e5; }
  .rule-card strong { display:block; margin-bottom:4px; font-size:14px; }
  .rule-card span { color:#6c6d64; font-size:12px; }
  .hero { overflow:hidden; border-radius:16px; background:#e7dfcf; box-shadow:0 8px 24px rgba(55,52,40,.12); }
  .hero svg { display:block; width:100%; height:auto; }
  .legend { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:12px; background:#faf7ef; }
  .legend div { display:flex; align-items:center; gap:7px; color:#64665d; font-size:12px; }
  .dot { width:18px; height:18px; flex:0 0 auto; border-radius:5px; border:1px solid rgba(30,30,20,.12); }
  .caption { padding:12px 14px 15px; background:#faf7ef; color:#55584f; font-size:13px; line-height:1.65; }
  .choices { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px; }
  .option { padding:11px 12px; border:2px solid transparent; border-radius:12px; background:#f4f0e5; color:#55584f; text-align:center; cursor:pointer; }
  .option.selected { border-color:#637c70; background:#edf1eb; }
  @media(max-width:760px){.rule,.legend,.choices{grid-template-columns:1fr}.hero svg{min-height:300px}}
</style>

<div class="board">
  <h1>青绿顶面 × 赭石侧面：圆缓坡肩试验</h1>
  <p class="lead">取消程序噪声。平地是一整片受控青绿；只有真实高差边界才发生颜色与形体过渡。</p>

  <div class="rule">
    <div class="rule-card"><strong>同高度区域</strong><span>保持完整平面，不出现格线、倒角或赭色边。</span></div>
    <div class="rule-card"><strong>暴露的高差边界</strong><span>顶面先降饱和，再经过圆缓坡肩进入赭石侧壁。</span></div>
  </div>

  <div class="hero">
    <svg viewBox="0 0 920 430" aria-label="青绿平地向赭石侧面圆缓过渡示意">
      <defs>
        <linearGradient id="topGreen" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#789080"/><stop offset="1" stop-color="#6F8575"/>
        </linearGradient>
        <linearGradient id="shoulder" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#7C856C"/><stop offset=".48" stop-color="#91846A"/><stop offset="1" stop-color="#AA8B68"/>
        </linearGradient>
        <linearGradient id="sideOchre" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#AA8B68"/><stop offset="1" stop-color="#C09C73"/>
        </linearGradient>
        <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
      </defs>

      <rect width="920" height="430" fill="#E7DFCF"/>

      <!-- 连续顶面：没有九宫格线 -->
      <path d="M68 48 H772 L854 126 L687 230 H102 L28 146 Z" fill="url(#topGreen)"/>
      <!-- 人工控制的大块淡色罩染，而不是程序噪声 -->
      <path d="M145 75 C270 46 403 83 524 62 C622 45 704 69 774 111 C665 101 588 126 490 119 C361 110 258 132 143 119 Z" fill="#8C9A83" opacity=".22" filter="url(#soft)"/>
      <path d="M86 139 C206 112 323 142 432 127 C535 113 608 135 690 171 C577 161 497 184 389 170 C272 155 191 175 96 163 Z" fill="#607A70" opacity=".14" filter="url(#soft)"/>

      <!-- 只在暴露边缘出现的灰橄榄过渡带 -->
      <path d="M102 198 H687 L854 126 L854 150 C794 180 743 213 690 246 H104 C74 227 52 209 35 189 L28 146 C52 168 74 185 102 198 Z" fill="#7C856C"/>
      <!-- 圆缓坡肩：曲面视觉而非直角盖子 -->
      <path d="M104 198 H690 C741 216 795 199 854 150 L854 196 C797 242 748 267 692 281 H106 C74 269 53 250 43 226 L35 189 C54 207 77 222 104 229 Z" fill="url(#shoulder)"/>
      <!-- 赭石侧面 -->
      <path d="M106 281 H692 C748 267 797 242 854 196 V321 C805 352 755 369 698 382 H112 C81 373 57 360 44 340 L43 226 C56 253 75 272 106 281 Z" fill="url(#sideOchre)"/>

      <!-- 少量有方向的手绘层次，避免随机斑点 -->
      <path d="M128 307 C276 293 397 318 530 300 C598 291 647 294 706 302" fill="none" stroke="#937456" stroke-width="7" opacity=".24" stroke-linecap="round"/>
      <path d="M101 344 C241 329 371 355 493 337 C589 323 654 334 728 329" fill="none" stroke="#D0B087" stroke-width="9" opacity=".28" stroke-linecap="round"/>

      <!-- 逻辑格线仅用虚线说明，不属于成品画面 -->
      <g stroke="#F3EAD9" stroke-width="2" stroke-dasharray="8 9" opacity=".36">
        <path d="M265 48 L231 230"/><path d="M478 48 L473 230"/><path d="M685 48 L687 230"/>
        <path d="M59 108 L809 108"/><path d="M44 169 L766 169"/>
      </g>
      <text x="61" y="34" fill="#5B675D" font-size="16">成品中不显示格线</text>
    </svg>

    <div class="legend">
      <div><i class="dot" style="background:#748A79"></i>青绿连续顶面</div>
      <div><i class="dot" style="background:#7C856C"></i>灰橄榄边缘</div>
      <div><i class="dot" style="background:#91846A"></i>青赭坡肩</div>
      <div><i class="dot" style="background:#B4936D"></i>暖赭石侧面</div>
    </div>
    <div class="caption">当前坡肩宽度约占一个地块的 15%–20%。平地仍保持平整；颜色过渡和圆缓形体只附着在同高度区域的外轮廓上。</div>
  </div>

  <div class="choices">
    <div class="option" data-choice="direction-works" onclick="toggleSelect(this)">方向成立</div>
    <div class="option" data-choice="too-soft" onclick="toggleSelect(this)">坡肩过软或过宽</div>
    <div class="option" data-choice="contrast-wrong" onclick="toggleSelect(this)">青绿与赭石关系不对</div>
  </div>
</div>
